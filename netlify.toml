# Netlify deploy config. The Vercel config in vercel.json is kept alongside it;
# neither platform reads the other's file, so both remain valid targets.

[build]
  # No build command at all. Netlify installs dependencies itself and bundles
  # the function from source, so there is nothing to compile; every command put
  # here so far has only been another way for the deploy to fail.
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # package.json requires >=20; pin it so a change to Netlify's default cannot
  # silently move the runtime underneath the API.
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Runs every 10 minutes. Netlify's scheduler invokes this function directly —
# the catch-all redirect below (which sends every ordinary HTTP path to the
# api function) does not apply to a scheduled invocation, so the two do not
# conflict. See netlify/functions/webinar-reminders.js.
[functions."webinar-reminders"]
  schedule = "*/10 * * * *"

# The whole Express app is one function; every path goes to it.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
